# Open projects page — rendered to projects.html by ./build.sh. PUBLIC.
#
# Everything here is world-readable. Keep out: unpublished results and numbers,
# participant data, collaborator names, host names, credentials.
#
# Task fields: title, size (small | medium | large), skills (list),
# description (markdown). Delete a task or project to unpublish it.

title: Open projects
contact: csengehubay@inf.elte.hu   # "Ask about this task" links mail here
intro: |
  Projects around my PhD in **ethorobotics** — building robots whose behaviour draws on
  what we know about animals, especially dogs — that have well-defined pieces of work
  open for students and collaborators. Each task can be scoped up or down; the size
  label is a starting point, not a contract. If one looks interesting, write to me and
  we will agree on the scope together.

projects:
  - id: mecanumbot
    name: MecanumBot
    status: active
    summary: |
      A small omnidirectional robot (mecanum wheels, Jetson Orin Nano, LiDAR and camera)
      used to study dog-inspired human–robot interaction. It detects people, can lead a
      person somewhere using gestures, lights or movement alone, reacts to pointing, plays
      fetch and searches for objects. The research question: does behaviour borrowed from
      dogs make a robot easier for people to understand? The software is ROS 2, with a
      2D simulator and a MuJoCo digital twin for work away from the robot.
    tasks:
      - title: First real-world runs of the object-search behaviour
        size: medium
        skills: [ROS 2, Nav2, Python, field testing]
        description: |
          The robot's explore-then-search pipeline passes its tests but has not yet run on
          the physical robot. Take it into a real room: tune navigation, check the camera
          mounting and height, find out what breaks, and turn the fixes into a repeatable
          launch procedure.
      - title: Full behaviour stack in the MuJoCo digital twin
        size: medium
        skills: [ROS 2, MuJoCo, launch files, simulation]
        description: |
          The robot has a physics-simulated twin, but the behaviour tree does not yet start
          together with the rest of the stack from one launch. Integrate it, and improve the
          simulation where it matters most: wheel–ground contact and more realistic
          (articulated) simulated people.
      - title: Learning the leading behaviour from data
        size: large
        skills: [Python, reinforcement learning, behaviour cloning, pygame]
        description: |
          A top-down simulator already records sessions in which people are led by the
          robot. Collect scripted baseline sessions, train a behaviour-cloning policy, then
          an offline reinforcement-learning policy, and compare them against the scripted
          behaviour. Part of the work is refactoring the study code so that it scales.
      - title: A fear response for the robot
        size: medium
        skills: [reinforcement learning, Gym-style environments, ROS 2]
        description: |
          Dogs freeze, avoid, or seek attention when something startles them. A first
          version of this behaviour exists on paper and in a training environment. Connect
          the environment to real LiDAR input, add the discrete response actions, and run it
          in simulation and then on the robot.
      - title: Robust framing for the motor-controller serial link
        size: small
        skills: [embedded C, Arduino / OpenCR, serial protocols]
        description: |
          The link to the stepper controller sends raw fixed-size packets with no framing,
          so a single lost byte corrupts the stream until reconnect. Design a small framed
          protocol (start marker, length, checksum) and implement it on both the firmware
          and the ROS 2 side.
      - title: Hearing the human — prosody as a social cue
        size: medium
        skills: [audio signal processing, Python, ROS 2]
        description: |
          People address dogs with a particular tone of voice, and dogs use it to tell
          whether a gesture is meant for them. The robot already records audio, but nothing
          uses it. Build a detector for this "addressing" speech prosody and feed it into
          the perception stack.

  - id: biscee
    name: Biscee — emotions expressed with crests
    status: active
    summary: |
      Biscee is a social robot with an expressive head and three pairs of movable crests,
      a little like a bird's feathers. Can people read emotions such as happiness, fear or
      anger from crest movements alone? If so, simple non-humanlike body parts are enough
      to carry emotional signals. Movement patterns for several emotions and intensities
      exist; the next step is turning them into a validated video study.
    tasks:
      - title: Make the crest emotions distinguishable
        size: small
        skills: [Python, ROS, motion design]
        description: |
          Some emotions currently end in very similar crest postures. Redesign the movement
          patterns so each emotion has its own recognisable shape and timing, drawing on how
          birds and mammals use crests and ears to signal.
      - title: Intensity levels and a control condition
        size: medium
        skills: [experimental design, motion design, Python]
        description: |
          Decide how emotional intensity should show in the movement — larger, faster, or by
          recruiting more crests — and design a control display (for example, the same
          movements with the order scrambled) so the study can show that viewers read the
          emotion, not just the motion.
      - title: Stimulus videos and online questionnaire
        size: medium
        skills: [video production, survey design]
        description: |
          Film the robot performing each movement pattern under consistent conditions, and
          build the questionnaire versions and presentation orders for an online
          emotion-recognition study.
      - title: Analysis plan and power analysis
        size: medium
        skills: [statistics, R, study preregistration]
        description: |
          Write the analysis plan before any data exists: the statistical models, a power
          analysis for the sample size, and a coding scheme for free-text answers.

  - id: citizen-science
    name: Citizen Science Portal
    status: working prototype
    summary: |
      A web portal where researchers publish short questionnaire studies and members of
      the public take part — a way to reach far more participants than lab studies can.
      Researchers can draft, publish and export studies; the interface is available in
      English, Hungarian and German. It currently runs on a single machine.
    tasks:
      - title: Make it ready for the public internet
        size: medium
        skills: [Node.js, MongoDB, DevOps, HTTPS / reverse proxy]
        description: |
          Harden the deployment: secrets management, HTTPS behind a reverse proxy, database
          authentication, and a proper consent and data-protection notice for participants.
      - title: Shared rate limiting
        size: small
        skills: [Node.js, Express, Redis]
        description: |
          Request limits are currently counted in memory per process. Move them to Redis so
          they hold across restarts and multiple server processes.
      - title: Video-rating questions
        size: medium
        skills: [JavaScript, front end, back end]
        description: |
          Studies can ask single-choice, multiple-choice and free-text questions. Add a
          question type that shows a video and collects ratings, so robot-behaviour studies
          such as the Biscee crest study can run on the portal.
